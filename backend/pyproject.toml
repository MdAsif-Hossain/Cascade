[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

# Depends()/Query() in argument defaults is FastAPI's documented dependency
# injection idiom, not the mutable-default bug B008 is looking for.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true

# scikit-learn and joblib ship no usable type information. The backend imports
# them only to load and call the persisted classifier; numpy is deliberately not
# imported here at all (see routing/classifier.py) so its 3.12-only stubs never
# have to be parsed under our 3.11 target.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "joblib", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Makes `app` importable under bare `pytest`, which is what CI runs.
# `python -m pytest` prepends the working directory to sys.path and bare `pytest`
# does not, so the two are not interchangeable — CI failed on "No module named
# 'app'" while the identical suite passed locally. Setting this explicitly means
# both invocations behave the same and the suite no longer depends on which
# directories happen to contain an __init__.py.
pythonpath = ["."]
