name: CI

on:
  push:
    branches: ["**"]
    # Tags point at historical commits. Pushing v0.1-proposal re-ran this
    # workflow against a commit from before the pytest sys.path fix and failed,
    # which says nothing about the current tree. Milestone tags are labels, not
    # something to re-test.
    tags-ignore: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      # No API keys are configured for CI on purpose: the suite must pass with
      # every provider unreachable, which is what proves respx is mocking all
      # HTTP rather than quietly reaching the network (CLAUDE.md section 13).
      - name: Test
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building here catches a broken image before a deploy does, which matters
      # because Render's free tier gives slow, rate-limited builds.
      - name: Build image
        run: docker build -t cascade-backend:ci backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check for a frontend
        id: exists
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.exists.outputs.present == 'true'
        run: npm ci

      - name: Type check and build
        if: steps.exists.outputs.present == 'true'
        run: npm run build
